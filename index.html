<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script> -->
  </head>

  <body>
    <a-scene
      <!--
      id="arScene"
      mindar-image="imageTargetSrc: ./ressources/targets.mind; filterMinCF:10000000; filterBeta:1000; warmupTolerance:0; missTolerance:500;" 
      color-space="sRGB"
      renderer="colorManagement:true,physicallyCorrectLights,antialias:true"
      vr-mode-ui="enabled:false"
      -->
      >

      <a-assets>
        <a-image id="poster" src="./ressources/slice.png"></a-image>
        <a-gltf-model id="verin" src="./ressources/piston.glb""></a-gltf-model>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

      <a-entity <!-- mindar-image-target="targetIndex:0" --> >
<a-entity id="CoupeAA" position="0.17116 -0.21646 -0.69986" scale="1 1 1">
 <a-image src="#poster" scale="1 2 1" position="0 0 0" material="opacity: 0.7"></a-image>
  
     <a-entity id="piston" position="0 0 0" animation="property: position; to: 0 -0.26 0; dur: 2000; easing: linear; loop: true; dir: alternate"> 
        <a-entity id="pistond" gltf-model="#verin" position="-0.23316 0.2834 -0.00158" rotation="0 -90.00021045914971 0" scale="0.09 0.09 0.09" animation="property: rotation; to: 0 -90.00021045914971 -90.00021045914971; dur: 2000; easing: linear; loop: true; dir: alternate" ></a-entity>
        <a-entity id="pistong" gltf-model="#verin" position="-0.17018 0.2834 -0.002" rotation="0 90.00021045914971 0" scale="0.09 0.09 0.09" animation="property: rotation; to: 0 90.00021045914971 90.00021045914971; dur: 2000; easing: linear; loop: true; dir: alternate"></a-entity>
      </a-entity>
        </a-entity>
        </a-entity>
      
      
      </a-entity>
    </a-scene>
  </body>
</html>
